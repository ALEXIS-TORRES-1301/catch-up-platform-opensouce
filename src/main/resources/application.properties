# Spring Application name
spring.application.name=CatchUp Platform

# Sprint DataSource Configuration
spring.datasource.url=JDBC:mysql://localhost:3306/catch-up-os?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# Spring Data JPA Configuration
spring.jpa.show-sql=true


# Spring JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=com.acme.catchingup.platform.shared.infrastructure.persistence.hibernate.CamelCaseToUnderscoresNamingStrategy


